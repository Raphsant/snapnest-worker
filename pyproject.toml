[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snapnest-worker"
version = "0.1.0"
description = "SnapNest pipeline worker: consumes SQS jobs, processes video with ffmpeg, writes status to Postgres."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "boto3>=1.34",
  "fonttools>=4.50",
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
  "yt-dlp==2026.8.19",
]

[project.optional-dependencies]
# boto3-stubs is dev-only: it gives mypy real types for the SQS/S3 clients so
# strict mode stays clean without scattering `# type: ignore` through the code.
dev = [
  "pytest>=8.0",
  "mypy>=1.8",
  "boto3-stubs[s3,sqs]>=1.34",
]

[tool.setuptools]
packages = ["worker", "worker.stages"]

# Ship the curator system prompt inside the wheel/image (pip install . otherwise
# drops non-Python files, which would break the curate stage at runtime).
[tool.setuptools.package-data]
worker = ["prompts/*.md"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
show_error_codes = true
files = ["worker", "tests"]

[[tool.mypy.overrides]]
# fontTools ships no py.typed marker, so strict mode can't resolve its types.
# We touch only a tiny, stable surface (ttLib TTFont advance widths).
module = ["fontTools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
